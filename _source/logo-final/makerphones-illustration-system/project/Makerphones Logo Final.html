<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerPhones — Logo · Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="lib/mp-site.css">
<style>
  .logo-ground { --mp-ground: #faf8f5; background: var(--mp-ground); color: var(--mp-charcoal, #2d3748); }
  .logo-dark { background: #111827; color: #f9fafb; --mp-accent: #fb923c; --mp-meta: #9ca3af; --mp-hair: #374151; }
  .lab { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
         text-transform: uppercase; color: var(--mp-meta, #6b7280); font-weight: 500; }
  .lab.dk { color: var(--mp-ink, #111827); font-weight: 600; }
  .deboss-dark { color: #1d2128; filter: drop-shadow(0 1px 0 rgba(255,255,255,0.07)) drop-shadow(0 -1px 1px rgba(0,0,0,0.55)); }
  .emboss-cream { color: #eee9e2; filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.9)) drop-shadow(0 1.5px 1.5px rgba(45,55,72,0.28)); }
  .src { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.7; white-space: pre;
         background: color-mix(in srgb, #2d3748 5%, transparent); padding: 14px 16px; overflow: auto; margin: 0; }
</style>
</head>
<body data-anim="on">
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="lib/mp-theme.jsx"></script>
<script type="text/babel" src="lib/mp-logo.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, MarkDriver, Wordmark, Lockup } = window;

const MARK_SVG_SOURCE = `<!-- makerphones mark — the driver section, 64-grid.
     color: currentColor · accent: var(--mp-accent, #ea580c)
     dark mode: --mp-accent: #fb923c · mono/emboss: replace accent with currentColor -->
<svg viewBox="0 0 64 64" width="64" height="64" aria-label="makerphones">
  <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="5"/>
  <circle cx="32" cy="32" r="13.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="4.2" fill="var(--mp-accent, #ea580c)"/>
</svg>`;

function board(id, label, w, h, node, dark) {
  return (
    <DCArtboard id={id} label={label} width={w} height={h}>
      <div data-screen-label={label} className={dark ? 'logo-dark' : 'logo-ground'}
        style={{ width: '100%', height: '100%', boxSizing: 'border-box', overflow: 'hidden' }}>
        {node}
      </div>
    </DCArtboard>
  );
}

function PrimarySheet() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: 34 }}>
      <Lockup symbol="driver" detail="dot" layout="horizontal" size={52} />
      <span className="lab">PRIMARY — THE DRIVER MARK + TERMINAL LEADER DOT</span>
    </div>
  );
}

function LockupSheet() {
  return (
    <div style={{ padding: '34px 44px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '40px 48px', alignItems: 'center' }}>
      <div>
        <Lockup symbol="driver" detail="dot" layout="horizontal" size={36} />
        <p className="lab" style={{ marginTop: 16 }}>HORIZONTAL — HEADER, DEFAULT</p>
      </div>
      <div>
        <Lockup symbol="driver" detail="dot" layout="tagline" size={34} />
        <p className="lab" style={{ marginTop: 16 }}>TAGLINE — COVERS, FOOTER</p>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <Lockup symbol="driver" detail="dot" layout="stacked" size={32} />
        <p className="lab" style={{ marginTop: 16 }}>STACKED — SQUARE CONTEXTS</p>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <Lockup symbol="driver" layout="symbol" size={44} />
        <p className="lab" style={{ marginTop: 16 }}>SYMBOL ONLY — AVATAR, FAVICON</p>
      </div>
    </div>
  );
}

function VariantsSheet() {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', height: '100%' }}>
      <div className="logo-ground" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 22 }}>
        <Lockup symbol="driver" detail="dot" layout="horizontal" size={28} />
        <span className="lab">LIGHT — CHARCOAL ON CREAM</span>
      </div>
      <div className="logo-dark" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 22 }}>
        <Lockup symbol="driver" detail="dot" layout="horizontal" size={28} />
        <span className="lab" style={{ color: '#9ca3af' }}>DARK — ACCENT #FB923C VIA TOKEN</span>
      </div>
      <div className="logo-ground" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 22, borderLeft: '1px solid var(--mp-hair, #d1d5db)' }}>
        <Lockup symbol="driver" detail="dot" layout="horizontal" size={28} mono={true} />
        <span className="lab">MONO — EMBOSS / SINGLE-COLOR</span>
      </div>
    </div>
  );
}

function SmallsSheet() {
  return (
    <div style={{ padding: '28px 36px', display: 'flex', flexDirection: 'column', gap: 24 }}>
      <div>
        <p className="lab dk" style={{ marginBottom: 14 }}>FAVICON LADDER — 48 / 32 / 24 / 16 · AVATAR TILE</p>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 26 }}>
          {[48, 32, 24, 16].map((s) => (
            <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
              <MarkDriver size={s} />
              <span className="lab">{s}</span>
            </div>
          ))}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, marginLeft: 18 }}>
            <div className="logo-dark" style={{ width: 44, height: 44, borderRadius: 9, display: 'grid', placeItems: 'center' }}>
              <MarkDriver size={28} />
            </div>
            <span className="lab">AVATAR</span>
          </div>
        </div>
      </div>
      <div>
        <p className="lab dk" style={{ marginBottom: 14 }}>PRESSED INTO A CUP — MONO, NO DOT</p>
        <div style={{ display: 'flex', gap: 30, alignItems: 'center' }}>
          <div style={{ width: 120, height: 120, borderRadius: '50%', background: '#23272e',
            boxShadow: 'inset 0 2px 6px rgba(255,255,255,0.05), inset 0 -3px 8px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.18)',
            display: 'grid', placeItems: 'center' }}>
            <div className="deboss-dark"><MarkDriver size={58} mono={true} /></div>
          </div>
          <div style={{ width: 120, height: 120, borderRadius: '50%', background: '#faf8f5',
            boxShadow: 'inset 0 1px 3px rgba(255,255,255,0.9), inset 0 -2px 6px rgba(45,55,72,0.15), 0 2px 6px rgba(45,55,72,0.12)',
            display: 'grid', placeItems: 'center' }}>
            <div className="emboss-cream"><MarkDriver size={58} mono={true} /></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function HeaderContext() {
  return (
    <div>
      <header style={{ display: 'flex', alignItems: 'center', gap: 48, padding: '0 48px', height: 64,
        borderBottom: '1px solid var(--mp-hair, #d1d5db)' }}>
        <Lockup symbol="driver" detail="dot" layout="horizontal" size={19} />
        <nav style={{ display: 'flex', gap: 28, marginLeft: 'auto' }}>
          {['The Manual', 'Bench Notes', 'Builds', 'About'].map((l, i) => (
            <span key={l} className="lab" style={i === 0 ? { color: 'var(--mp-ink, #111827)', fontWeight: 600 } : null}>{l}</span>
          ))}
        </nav>
        <span className="lab">v2 · Open manual</span>
      </header>
      <div className="logo-dark" style={{ display: 'flex', alignItems: 'center', gap: 48, padding: '0 48px', height: 64 }}>
        <Lockup symbol="driver" detail="dot" layout="horizontal" size={19} />
        <span className="lab" style={{ marginLeft: 'auto', color: '#9ca3af' }}>DARK — SAME MARKUP, RE-SCOPED TOKENS</span>
      </div>
    </div>
  );
}

function HandoffSheet() {
  return (
    <div className="sheet logo-ground" data-screen-label="Handoff spec" style={{ width: '100%', height: '100%', background: 'transparent' }}>
      <h2><span className="fig">SPEC</span>HANDOFF — MARK SOURCE & RULES</h2>
      <pre className="src">{MARK_SVG_SOURCE}</pre>
      <ul style={{ marginTop: 14 }}>
        <li><strong>Wordmark:</strong> Schibsted Grotesk 700, lowercase, <code>letter-spacing: -0.03em</code>. Terminal dot = 0.115em circle in <code>--mp-accent</code>, 0.09em gap, sits on the baseline.</li>
        <li><strong>Lockup spacing</strong> (relative to wordmark font-size <em>S</em>): symbol height 1.18&times;S, gap 0.42&times;S; tagline in JetBrains Mono 0.26&times;S, +18% tracking, uppercase.</li>
        <li><strong>Clear space:</strong> half the mark's height on all sides. <strong>Minimum sizes:</strong> mark 16px; horizontal lockup 96px wide.</li>
        <li><strong>Color is scoping, not files:</strong> mark inherits <code>currentColor</code>; the dot reads <code>--mp-accent</code> (light #ea580c · dark #fb923c). Mono/emboss: replace the dot fill with <code>currentColor</code> — never omit the dot.</li>
        <li><strong>Orange discipline:</strong> the dot is the only accent. Never fill the rings with orange — the dome dot only.</li>
        <li><strong>Favicon:</strong> serve the symbol-only SVG; it replaces the current placeholder favicon.</li>
      </ul>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="primary" title="makerphones — final logo" subtitle="S1 driver mark + terminal leader dot · approved">
        {board('primary', 'Primary lockup', 980, 360, <PrimarySheet />)}
      </DCSection>
      <DCSection id="lockups" title="Lockups & variants">
        {board('lockups', 'The four lockups', 980, 440, <LockupSheet />)}
        {board('variants', 'Light · dark · mono', 980, 280, <VariantsSheet />)}
      </DCSection>
      <DCSection id="smalls" title="Small sizes & physical">
        {board('smalls', 'Favicon · avatar · molded', 880, 420, <SmallsSheet />)}
        {board('header', 'In the header — light + dark', 1240, 130, <HeaderContext />)}
      </DCSection>
      <DCSection id="handoff" title="Handoff" subtitle="SVG source + usage rules for Claude Code">
        {board('handoff', 'Mark source & rules', 880, 700, <HandoffSheet />)}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
