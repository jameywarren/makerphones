<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerPhones — Illustration System & Figure Extensions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="lib/mp-site.css">
</head>
<body data-anim="on">
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="lib/mp-theme.jsx"></script>
<script type="text/babel" src="lib/mp-listeners.jsx"></script>
<script type="text/babel" src="lib/mp-hero.jsx"></script>
<script type="text/babel" src="lib/mp-motifs.jsx"></script>
<script type="text/babel" src="lib/mp-fig-revisions.jsx"></script>
<script type="text/babel" src="lib/mp-figs-t1.jsx"></script>
<script type="text/babel" src="lib/mp-figs-t2.jsx"></script>
<script type="text/babel" src="lib/mp-figs-t3.jsx"></script>
<script type="text/babel">
const {
  DesignCanvas, DCSection, DCArtboard,
  useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakSlider,
  MP, MotifWave, MotifRuler, MotifFR, MotifArcs, MpIcon, MpDifficulty,
  HeroExploded, PoseListening, PoseBuilding, PoseReading, PoseInspecting,
  ListenerHead, FigPhones, FigStandingV2, FigCSDv2,
  FigFR, FigImpedance, FigPad, FigDamping, FigConnector, FigFormFactor,
  FigProcess, FigWireless, FigANC, FigIEM,
  FigLumped, FigMatching, FigDiagnosis, FigMicWiring,
} = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroWeight": "mass",
  "heroMotion": "settle",
  "face": "none",
  "animations": true
}/*EDITMODE-END*/;

function MarginaliaStrip() {
  const poses = [
    [PoseListening, 150], [PoseBuilding, 205], [PoseReading, 165], [PoseInspecting, 150],
  ];
  return (
    <div className="sheet" data-screen-label="Marginalia scale" style={{ width: '100%' }}>
      <h2><span className="fig">RULING</span>FIGURES — MARGINALIA SCALE ONLY · FACELESS · GESTURAL</h2>
      <div style={{ display: 'flex', gap: 28, alignItems: 'flex-end', marginTop: 10 }}>
        {poses.map(([P, w], i) => (
          <div key={i} style={{ width: w }}><P anatomy="contour" face="none" annotated={false} /></div>
        ))}
        <p className="serif" style={{ maxWidth: '30ch', paddingBottom: 18, color: 'var(--mp-meta)' }}>
          At this scale the pose carries it — section breaks, build-guide margins, 404s. Never the hero.
        </p>
      </div>
    </div>
  );
}

function IconSheet() {
  const parts = [
    ['fundamentals', 'PART 01'], ['drivers', 'PART 02'], ['enclosures', 'PART 03'],
    ['materials', 'PART 04'], ['build', 'PART 05'], ['measure', 'PART 06'],
  ];
  const way = [['read', 'READ'], ['build', 'BUILD'], ['measure', 'MEASURE'], ['contents', 'CONTENTS'], ['arrow', 'GO']];
  const cell = { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, padding: '18px 8px', border: '1px solid var(--mp-hair)' };
  return (
    <div className="sheet" data-screen-label="Icon set" style={{ width: '100%' }}>
      <h2><span className="fig">FIG. I</span>ICON SET — 24 GRID · STROKE 1.6 · ONE ACCENT ELEMENT MAX</h2>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10, marginTop: 18 }}>
        {parts.map(([n, l]) => (
          <div key={n} style={cell}><MpIcon name={n} size={30} /><span className="mono">{l}</span></div>
        ))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10, marginTop: 10 }}>
        {[1, 2, 3].map((d) => (
          <div key={d} style={cell}><MpDifficulty level={d} size={30} /><span className="mono">{['BEGINNER', 'INTERMEDIATE', 'ADVANCED'][d - 1]}</span></div>
        ))}
        {way.slice(0, 3).map(([n, l]) => (
          <div key={n} style={cell}><MpIcon name={n} size={30} /><span className="mono">{l}</span></div>
        ))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10, marginTop: 10 }}>
        {way.slice(3).map(([n, l]) => (
          <div key={n} style={cell}><MpIcon name={n} size={30} /><span className="mono">{l}</span></div>
        ))}
      </div>
    </div>
  );
}

function board(id, label, w, h, node, pad = 0) {
  return (
    <DCArtboard id={id} label={label} width={w} height={h}>
      <div data-screen-label={label} style={{ width: '100%', height: '100%', background: 'var(--mp-ground, #f9fafb)', padding: pad, boxSizing: 'border-box', overflow: 'hidden' }}>
        {node}
      </div>
    </DCArtboard>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.body.dataset.anim = t.animations ? 'on' : 'off';
  }, [t.animations]);

  return (
    <div>
      <DesignCanvas>
        <DCSection id="hero" title="Hero exploded headphone" subtitle="Two weight dialects — motion mode via Tweaks (hover the figure in 'hover' mode)">
          {board('hero-mass', 'Mass-fill dialect (homepage hero)', 1000, 760,
            <div style={{ padding: 24 }}><HeroExploded weight="mass" motion={t.heroMotion} annotated={true} header="DAILY DRIVER — EXPLODED" caption="MASS DIALECT — FILLED MAGNETS, WEIGHTED SHELLS" /></div>)}
          {board('hero-line', 'Pure line dialect (cover + article use)', 1000, 760,
            <div style={{ padding: 24 }}><HeroExploded weight="line" motion={t.heroMotion} annotated={true} header="DAILY DRIVER — EXPLODED" caption="LINE DIALECT — AIRY, FOR COVER + ARTICLE USE" /></div>)}
        </DCSection>

        <DCSection id="listeners" title="The listeners — marginalia only" subtitle="Ruling: faceless, gestural, small — never hero mascots. Face variant via Tweaks.">
          {board('marginalia', 'Marginalia scale — the approved usage', 1060, 330, <MarginaliaStrip />)}
          {board('pose-1', 'I · The Listener — annotated', 440, 500,
            <div style={{ width: 380, padding: '24px 30px 0' }}><PoseListening anatomy="contour" face={t.face} annotated={true} /></div>)}
          {board('pose-2', 'II · The Builder — annotated', 600, 500,
            <div style={{ width: 545, padding: '24px 28px 0' }}><PoseBuilding anatomy="contour" face={t.face} annotated={true} /></div>)}
          {board('pose-3', 'III · The Reader — annotated', 500, 500,
            <div style={{ width: 440, padding: '24px 30px 0' }}><PoseReading anatomy="contour" face={t.face} annotated={true} /></div>)}
          {board('pose-4', 'IV · The Inspector — annotated', 440, 500,
            <div style={{ width: 380, padding: '24px 30px 0' }}><PoseInspecting anatomy="contour" face={t.face} annotated={true} /></div>)}
        </DCSection>

        <DCSection id="figs-t1" title="Figure extensions — Tier 1 · FIG 09–14" subtitle="Foundational, heavily referenced · line dialect, FIG 00 conventions">
          {board('fig09', '09 · Frequency response', 808, 548, <div style={{ padding: 24 }}><FigFR /></div>)}
          {board('fig10', '10 · Impedance & sensitivity', 808, 518, <div style={{ padding: 24 }}><FigImpedance /></div>)}
          {board('fig11', '11 · Ear-pad cross-section', 808, 518, <div style={{ padding: 24 }}><FigPad /></div>)}
          {board('fig12', '12 · Damping placement map', 808, 518, <div style={{ padding: 24 }}><FigDamping /></div>)}
          {board('fig13', '13 · Connector & wiring', 808, 518, <div style={{ padding: 24 }}><FigConnector /></div>)}
          {board('fig14', '14 · Form factors', 808, 518, <div style={{ padding: 24 }}><FigFormFactor /></div>)}
        </DCSection>

        <DCSection id="figs-t2" title="Figure extensions — Tier 2 · FIG 15–18" subtitle="Process & special topics">
          {board('fig15', '15 · Design process', 808, 468, <div style={{ padding: 24 }}><FigProcess /></div>)}
          {board('fig16', '16 · Wireless signal chain', 808, 518, <div style={{ padding: 24 }}><FigWireless /></div>)}
          {board('fig17', '17 · ANC mic topology', 808, 528, <div style={{ padding: 24 }}><FigANC /></div>)}
          {board('fig18', '18 · IEM cross-section', 808, 518, <div style={{ padding: 24 }}><FigIEM /></div>)}
        </DCSection>

        <DCSection id="figs-t3" title="Figure extensions — Tier 3 · FIG 19–22" subtitle="Stretch · modeling, tolerance, diagnosis, mic wiring">
          {board('fig19', '19 · Lumped-element model', 808, 548, <div style={{ padding: 24 }}><FigLumped /></div>)}
          {board('fig20', '20 · Channel matching', 808, 518, <div style={{ padding: 24 }}><FigMatching /></div>)}
          {board('fig21', '21 · Reading a measurement', 808, 528, <div style={{ padding: 24 }}><FigDiagnosis /></div>)}
          {board('fig22', '22 · Mic wiring & placement', 808, 528, <div style={{ padding: 24 }}><FigMicWiring /></div>)}
        </DCSection>

        <DCSection id="figrev" title="Figure revisions" subtitle="FIG 05 second harmonic · FIG 06 denser ridge">
          {board('fig05b', '05b · Second harmonic', 768, 478, <div style={{ padding: 24 }}><FigStandingV2 harmonic={2} /></div>)}
          {board('fig06b', '06b · Dense waterfall', 808, 518, <div style={{ padding: 24 }}><FigCSDv2 dense={true} /></div>)}
        </DCSection>

        <DCSection id="motifs" title="Motifs & texture" subtitle="Quiet — for dividers and faint backgrounds">
          {board('m-wave', 'Waveform divider', 1240, 130, <div style={{ padding: '28px 20px' }}><MotifWave w={1200} h={72} /></div>)}
          {board('m-ruler', 'Ruler strip', 1240, 76, <div style={{ padding: '28px 20px 0' }}><MotifRuler w={1200} /></div>)}
          {board('m-fr', 'FR backdrop (light + dark scope)', 960, 420,
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', height: '100%' }}>
              <div style={{ padding: 24 }}><MotifFR w={420} h={330} /></div>
              <div className="mp-darkscope" style={{ padding: 24, background: '#111827' }}><MotifFR w={420} h={330} /></div>
            </div>)}
          {board('m-arcs', 'Pressure arcs — corner', 300, 300, <div style={{ padding: 20 }}><MotifArcs size={250} corner="tl" animated={true} /></div>)}
          {board('m-grid', 'Blueprint grid', 360, 300, <div className="mp-grid-bg" style={{ width: '100%', height: '100%' }}></div>)}
        </DCSection>

        <DCSection id="icons" title="Icon set" subtitle="Six parts · difficulty · wayfinding">
          {board('icons', 'Icons — line style', 880, 480, <IconSheet />)}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Hero figure" />
        <TweakRadio label="Motion" value={t.heroMotion} options={['settle', 'breathe', 'hover']}
          onChange={(v) => setTweak('heroMotion', v)} />
        <TweakSection label="Figures" />
        <TweakRadio label="Faces" value={t.face} options={['none', 'line', 'soft']}
          onChange={(v) => setTweak('face', v)} />
        <TweakSection label="Motion" />
        <TweakToggle label="Animations" value={t.animations}
          onChange={(v) => setTweak('animations', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
