<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerPhones — Diagram Set 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; }

  /* ── MakerPhones diagram motion system ──────────────────────────────
     CSS keyframes only. Every figure reads as a static still when
     motion is off (prefers-reduced-motion), so animation is an aid. */
  @media (prefers-reduced-motion: no-preference) {

    /* FIG 01 / 03 — diaphragm excursion */
    .mp-osc   { animation: mpOscX 1.5s ease-in-out infinite; }
    .mp-osc-s { animation: mpOscXs 1.5s ease-in-out infinite; }

    /* radiating wavefronts */
    .mp-wave-out   { animation: mpWaveOut 2.4s linear infinite; }
    .mp-wave-out2  { animation: mpWaveOut2 2.4s linear infinite; }
    .mp-wave-front { animation: mpWaveFront 2.6s linear infinite; }
    .mp-wave-back  { animation: mpWaveBack 2.6s linear infinite; }

    /* FIG 02 — travelling waves */
    .mp-scroll { animation: mpScroll 1.8s linear infinite; }

    /* FIG 04 — air spring (diaphragm + chamber compression, synced) */
    .mp-air-s  { animation: mpAirS 2.2s ease-in-out infinite; }
    .mp-air-l  { animation: mpAirL 2.2s ease-in-out infinite; }
    .mp-cham-s { animation: mpChamS 2.2s ease-in-out infinite; }
    .mp-cham-l { animation: mpChamL 2.2s ease-in-out infinite; }

    /* FIG 05 — standing wave: slow build-up envelope × fast oscillation */
    .sw-build { animation: swBuild 7s ease-in-out infinite; }
    .sw-osc   { animation: swOsc 1.1s ease-in-out infinite; }

    /* FIG 06 — decay pulse travelling back through the time slices */
    .csd-slice { animation: csdPulse 4.2s linear infinite; }
  }

  @keyframes mpOscX  { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  @keyframes mpOscXs { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }

  @keyframes mpWaveOut   { 0% { transform: translateX(0); opacity: 0.85; } 100% { transform: translateX(64px); opacity: 0; } }
  @keyframes mpWaveOut2  { 0% { transform: translateX(0); opacity: 0.85; } 100% { transform: translateX(36px); opacity: 0; } }
  @keyframes mpWaveFront { 0% { transform: translateX(0); opacity: 0.6; } 100% { transform: translateX(-52px); opacity: 0; } }
  @keyframes mpWaveBack  { 0% { transform: translateX(0); opacity: 0; } 25% { opacity: 0.7; } 100% { transform: translateX(-56px); opacity: 0; } }

  @keyframes mpScroll { to { transform: translateX(-75px); } }

  @keyframes mpAirS  { 0%, 100% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  @keyframes mpAirL  { 0%, 100% { transform: translateX(-9px); } 50% { transform: translateX(9px); } }
  @keyframes mpChamS { 0%, 100% { transform: scaleX(1.045); } 50% { transform: scaleX(0.955); } }
  @keyframes mpChamL { 0%, 100% { transform: scaleX(1.036); } 50% { transform: scaleX(0.964); } }

  @keyframes swBuild { 0% { transform: scaleY(0.12); } 55% { transform: scaleY(1); } 88% { transform: scaleY(1); } 100% { transform: scaleY(0.12); } }
  @keyframes swOsc   { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-1); } }

  @keyframes csdPulse { 0% { opacity: 0.55; } 6% { opacity: 1; } 16% { opacity: 0.55; } 100% { opacity: 0.55; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="diagrams/mp-theme.jsx"></script>
<script type="text/babel" src="diagrams/mp-figs-1-4.jsx"></script>
<script type="text/babel" src="diagrams/mp-figs-5-8.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, FigNotes, FigDriver, FigPhase, FigBack, FigAirSpring, FigStanding, FigCSD, FigChain, FigTech } = window;

  // NOTE: DCSection type-checks its children, so this must be called as a
  // plain function ({board(...)}) — it returns a real <DCArtboard> element.
  function board(id, label, w, h, fig) {
    return (
      <DCArtboard id={id} label={label} width={w + 48} height={h + 48}>
        <div data-screen-label={label} style={{ padding: 24, background: '#f9fafb', width: '100%', height: '100%', boxSizing: 'border-box' }}>
          {fig}
        </div>
      </DCArtboard>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="system" title="System" subtitle="Shared visual conventions for the set">
          {board('fig00', '00 · System notes', 560, 380, <FigNotes />)}
        </DCSection>
        <DCSection id="making-sound" title="Making sound" subtitle="Driver fundamentals — animated">
          {board('fig01', '01 · Dynamic driver', 720, 440, <FigDriver />)}
          {board('fig02', '02 · Phase & cancellation', 760, 420, <FigPhase />)}
        </DCSection>
        <DCSection id="cups" title="Cups & cavities" subtitle="Enclosure acoustics — animated">
          {board('fig03', '03 · Open vs closed back', 880, 440, <FigBack />)}
          {board('fig04', '04 · The air spring', 880, 470, <FigAirSpring />)}
          {board('fig05', '05 · Standing waves', 720, 430, <FigStanding />)}
        </DCSection>
        <DCSection id="measurement" title="Measurement & tuning" subtitle="06 animated · 07 static">
          {board('fig06', '06 · Decay waterfall', 760, 470, <FigCSD />)}
          {board('fig07', '07 · Chain & tuning loop', 880, 420, <FigChain />)}
        </DCSection>
        <DCSection id="tech" title="Driver technologies" subtitle="Reference — static">
          {board('fig08', '08 · Four ways to move air', 1040, 430, <FigTech />)}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
