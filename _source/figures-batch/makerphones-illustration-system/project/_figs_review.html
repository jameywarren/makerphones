<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>figs review</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; background: #eee; }
  .cell { background: #f9fafb; outline: 1px solid #ccc; margin: 12px; display: inline-block; vertical-align: top; }
  * { animation: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="lib/mp-theme.jsx"></script>
<script type="text/babel" src="lib/mp-figs-t1.jsx"></script>
<script type="text/babel" src="lib/mp-figs-t2.jsx"></script>
<script type="text/babel" src="lib/mp-figs-t3.jsx"></script>
<script type="text/babel">
const { FigFR, FigImpedance, FigPad, FigDamping, FigConnector, FigFormFactor,
        FigProcess, FigWireless, FigANC, FigIEM,
        FigLumped, FigMatching, FigDiagnosis, FigMicWiring } = window;
const figs = [FigFR, FigImpedance, FigPad, FigDamping, FigConnector, FigFormFactor,
  FigProcess, FigWireless, FigANC, FigIEM, FigLumped, FigMatching, FigDiagnosis, FigMicWiring];
function App() {
  return <div>{figs.map((F, i) => <div key={i} className="cell" id={'f' + i}><F /></div>)}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
