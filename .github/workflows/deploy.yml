name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Quality gate — no visible chapter/part numbers
        run: node scripts/check-no-chapter-numbers.mjs
      # Build the downloadable book from the freshly built site, so the PDF on
      # makerphones.com regenerates on every content change. Uses the runner's
      # preinstalled google-chrome (render.mjs auto-detects it; no Chromium
      # download). Runs AFTER the quality gate so book.html isn't scanned.
      - name: Assemble the book (HTML)
        run: node scripts/to-book/collect.mjs
      - name: Render the book PDF
        run: node scripts/to-book/render.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
