<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover — print wrap</title>
<!--
  Print-ready full-wrap cover (back · spine · front) for The Art and Science of
  Headphone Design. Single page sized to the exact KDP sheet: 7+spine+7 trim +
  0.125in bleed all round. Spine = 282 pp × 0.002252 (KDP white) = 0.635 in.
  Renders via scripts/to-book/render-cover.mjs. The preview/edit surface is the
  Claude Design Cover.html; this is the headless print target. Same engine
  (covers.js) + FR plate (fr-svgs.js) as that board.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --mp-ink:#111827; --mp-charcoal:#2d3748; --mp-accent:#ea580c; --mp-accent-text:#c2410c;
  --mp-bg:#faf8f5; --mp-surface:#ffffff; --mp-line:#e7e5e0; --mp-meta:#6b7280; --mp-faint:#9ca3af;
  --cover-accent:#ea580c; --fr-grid:#d9d6d0; --fr-ink:#2d3748;
  --sans:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --bleed:0.125in; --back:7in; --front:7in; --spine:0.635in;
  --shadow-warm:0 1px 2px rgba(124,45,18,.04),0 6px 20px rgba(124,45,18,.06);
}
*{box-sizing:border-box;}
@page{ size:14.885in 10.25in; margin:0; }
html,body{ margin:0; padding:0; background:#fff; }
.mono{ font-family:var(--mono); font-feature-settings:"tnum" 1; }

/* wrap sheet — bleed + back + spine + front */
.wrap{ position:relative; width:calc(var(--bleed)*2 + var(--back) + var(--spine) + var(--front));
  height:calc(var(--bleed)*2 + 10in); background:var(--mp-bg); }
.trim{ position:absolute; top:var(--bleed); left:var(--bleed); display:flex; }
.panel{ position:relative; height:10in; overflow:hidden; }
.panel.back{ width:var(--back); }
.panel.front{ width:var(--front); }
.spine{ position:relative; width:var(--spine); height:10in; background:var(--mp-bg);
  border-left:1px solid rgba(45,55,72,.12); border-right:1px solid rgba(45,55,72,.12); }

/* shared chrome */
.blueprint{ position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(to right,rgba(45,55,72,.07) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(45,55,72,.07) 1px,transparent 1px);
  background-size:0.25in 0.25in; }
.ruler{ height:11px; position:relative; margin:0;
  background-image:repeating-linear-gradient(to right,var(--mp-line) 0 1px,transparent 1px 14px);
  border-bottom:1px solid var(--mp-line); }
.ruler::after{ content:''; position:absolute; left:0; bottom:-1px; width:56px;
  border-bottom:2px solid var(--cover-accent); }
.logo{ display:inline-flex; align-items:center; gap:8px; }
.logo-name{ font-family:var(--sans); font-weight:700; font-size:15px; letter-spacing:-.02em; color:var(--mp-charcoal); }
.kicker-foot{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--mp-meta); }

/* FR plate */
.fr-plate{ margin:0; background:var(--mp-surface); border:1px solid var(--mp-line); border-radius:8px;
  padding:20px 22px 14px; position:relative; box-shadow:var(--shadow-warm); }
.fr-holder{ width:100%; line-height:0; }
.fr-holder svg{ display:block; width:100%; height:auto; }
.fr-holder text.ax,.fr-holder .ax{ font-family:var(--mono); font-size:11px; fill:var(--mp-meta); letter-spacing:.04em; }
.fr-cap{ font-family:var(--mono); font-size:10px; line-height:1.5; color:var(--mp-meta);
  border-top:1px solid var(--mp-line); margin-top:12px; padding-top:9px; letter-spacing:.01em; }
.fr-cap b{ color:var(--mp-charcoal); font-weight:600; letter-spacing:.08em; }
.tick{ position:absolute; width:13px; height:13px; z-index:2; }
.tick.tl{ top:-1px; left:-1px; border-top:2px solid var(--cover-accent); border-left:2px solid var(--cover-accent); }
.tick.tr{ top:-1px; right:-1px; border-top:2px solid var(--cover-accent); border-right:2px solid var(--cover-accent); }
.tick.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--cover-accent); border-left:2px solid var(--cover-accent); }
.tick.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--cover-accent); border-right:2px solid var(--cover-accent); }

/* front */
.cf{ position:absolute; inset:0; z-index:1; }
.cf-a{ display:flex; }
.cf-a .cf-inner{ flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:0.66in 0.62in 0.56in; }
.cf-title{ font-family:var(--sans); font-weight:700; color:var(--mp-charcoal); letter-spacing:-.022em; margin:0; }
.cf-title .tl{ display:block; }
.cf-a .ruler{ margin-bottom:22px; }
.cf-a .cf-title{ font-size:56px; line-height:.97; }
.cf-a .cf-tag{ font-family:var(--body); font-style:italic; font-size:15.5px; line-height:1.45; color:var(--mp-meta); margin:18px 0 0; max-width:30ch; }
.cf-a .cf-foot{ display:flex; align-items:flex-end; justify-content:space-between; }
.foot-r{ display:flex; flex-direction:column; align-items:flex-end; gap:7px; text-align:right; }
.byline{ display:flex; flex-direction:column; gap:4px; }
.by-label{ font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; color:var(--mp-meta); }
.author{ font-family:var(--sans); font-weight:600; font-size:20px; letter-spacing:-.01em; color:var(--mp-charcoal); }

/* back */
.cb{ position:absolute; inset:0; z-index:1; }
.cb .cb-inner{ position:absolute; inset:0; display:flex; flex-direction:column; padding:0.7in 0.62in 0.56in 0.7in; }
.cb .ruler{ margin-bottom:26px; }
.cb-lead{ font-family:var(--body); font-weight:600; font-size:18px; line-height:1.5; color:var(--mp-charcoal); margin:0 0 18px; max-width:46ch; }
.cb-body{ font-family:var(--body); font-size:13.5px; line-height:1.62; color:var(--mp-ink); margin:0 0 14px; max-width:50ch; }
.cb-bio{ margin-top:auto; display:flex; gap:14px; align-items:flex-start; padding:18px 0 0; border-top:1px solid var(--mp-line); }
.cb-bio-txt{ font-family:var(--body); font-size:12.5px; line-height:1.55; color:var(--mp-meta); margin:0; max-width:48ch; }
.cb-bio-txt b{ color:var(--mp-charcoal); font-weight:600; }
.cb-foot{ display:flex; align-items:flex-end; justify-content:space-between; margin-top:26px; }
.cb-foot-l{ display:flex; flex-direction:column; gap:8px; }
.cb-url{ font-size:11px; letter-spacing:.04em; color:var(--mp-accent-text); }
.cb-copy{ font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mp-meta); }
.isbn{ width:2in; }
/* Clean reserved white space — KDP/Ingram place the real ISBN barcode here. */
.isbn-zone{ height:1.15in; background:#fff; border:1px solid var(--mp-line); border-radius:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="trim">
      <div class="panel back" id="wrap-back"></div>
      <div class="spine" id="wrap-spine"></div>
      <div class="panel front" id="wrap-front"></div>
    </div>
  </div>
  <script src="fr-svgs.js"></script>
  <script src="covers.js"></script>
</body>
</html>
